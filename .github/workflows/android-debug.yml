name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Set backend URL (repo variable API_BASE_URL)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: echo "window.NCX_API_BASE = '${API_BASE_URL}';" > public/config.js
      - name: Add Android platform
        run: npx cap add android
      - name: Generate ikon dari logo (assets/logo.png)
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: neon-code-x-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
